name: Deploy VEYRA frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # --legacy-peer-deps is required, not cosmetic: @bnbagent/sdk pins a peer of
      # @altananetwork/sdk <0.6.0 (its latest release pins exactly 0.7.1), while this project runs
      # 0.9.0. We use exactly one symbol from that package -- EVMWalletProvider, for keystore
      # signing -- and it never touches Altana, so the conflict is real to npm and inert at
      # runtime. The lockfile is generated with the same flag; dropping it here makes CI and local
      # disagree, which is exactly how this broke.
      - run: npm ci --legacy-peer-deps
      - run: npm run build --workspace=@veyra/core
      - run: npm run build --workspace=@veyra/chain
      - run: npm run build --workspace=@veyra/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
